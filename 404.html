<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#8a3ffc" />
  <title>Página no encontrada — Dominique Reyes</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="icon" href="assets/img/favicon.ico" sizes="any" />
  <link rel="icon" href="assets/img/favicon.png" type="image/png" sizes="48x48" />
  <link rel="stylesheet" href="assets/css/estilos.css" />
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
    }

    .error-code {
      font-family: "Poppins", sans-serif;
      font-weight: 800;
      font-size: clamp(72px, 14vw, 140px);
      color: var(--purple);
      line-height: 1;
    }

    .error-title {
      font-family: "Poppins", sans-serif;
      font-weight: 700;
      font-size: clamp(20px, 3vw, 28px);
      color: var(--navy);
      margin: 8px 0 12px;
    }

    .error-text {
      color: var(--text-soft);
      font-size: 15px;
      max-width: 420px;
      margin: 0 auto 28px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main class="error-page">
    <div>
      <div class="error-code">404</div>
      <h1 class="error-title">Esta página no existe</h1>
      <p class="error-text">
        Puede que el enlace esté roto o que la página se haya movido.
        Volvamos al inicio del portafolio.
      </p>
      <a href="/dominiqueportafolio/" class="btn btn-primary">Volver al inicio</a>
    </div>
  </main>
</body>

</html>
